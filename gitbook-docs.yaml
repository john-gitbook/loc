$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Multilingual Docs Test
  structure:
    - type: section
      key: section-1
      title: docs
      path: docs
      default: true
      children:
        - type: space
          key: space-1
          title: docs
          path: docs
          default: true
          content:
            directory: ./docs
            language: en
        - type: space
          key: space-2
          title: Français
          path: francais
          content:
            directory: ./docs/francais
            language: fr
        - type: space
          key: space-3
          title: Deutsch
          path: deutsch
          content:
            directory: ./docs/deutsch
            language: de
